                      bankIdIssueDate: 2023-04-01Z
                      stepUp:
                        mrtd: true
                      signature: <base64-encoded data>
                      ocspResponse: <base64-encoded data>
                      risk: low
                Order pending:
                  description: A collect response indicating that the order is not
                    yet completed by the user
                  value:
                    orderRef: 131daac9-16c6-4618-beb0-365768f37288
                    status: pending
                    hintCode: userSign
                Order failed:
                  description: "A collect response indicating that the order failed\
                    \ to complete. In this example, the reason is that the user cancelled\
                    \ the order"
                  value:
                    orderRef: 131daac9-16c6-4618-beb0-365768f37288
                    status: failed
                    hintCode: userCancel
              schema:
                $ref: "#/components/schemas/collect_response"
          description: Request successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
          description: Bad request.
        "401":
          description: You do not have access to the service.
        "403":
          description: You do not have access to the service.
        "404":
          description: An invalid URL path was used.
        "405":
          description: Only HTTP method POST is allowed.
        "408":
          description: Timeout while transmitting the request.
        "415":
          description: The type is missing or invalid.
        "500":
          description: Internal technical error in the BankID system.
        "503":
          description: The service is temporarily unavailable.
      summary: Gather order information and status.
  /cancel:
    post:
      description: |-
        Cancels an ongoing order.

        This is typically used if the user cancels the order in your service or app.
      operationId: cancel
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: A request identifying the order to cancel
                value:
                  orderRef: 131daac9-16c6-4618-beb0-365768f37288
            schema:
              $ref: "#/components/schemas/collect_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/empty_response"
          description: Request successful.
        "400":
          content:
