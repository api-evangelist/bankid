  /collect:
    post:
      description: |-
        Collects the result of an order using `orderRef` as reference.

        Your service should continue calling collect every two seconds if the status reported is is `pending`. Your
        service must abort if the status is `failed`.

        The user identity is returned when complete.
      operationId: collect
      requestBody:
        content:
          application/json:
            examples:
              simple:
                summary: A request identifying the order to collect
                value:
                  orderRef: 131daac9-16c6-4618-beb0-365768f37288
            schema:
              $ref: "#/components/schemas/collect_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Order completed:
                  description: A collect response indicating a successfully completed
                    order
                  value:
                    orderRef: 131daac9-16c6-4618-beb0-365768f37288
                    status: complete
                    completionData:
