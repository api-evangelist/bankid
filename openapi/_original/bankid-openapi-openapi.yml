  /other/payment:
    post:
      description: |-
        Initiates a card payment order when your organization is not talking to user over the phone and you are unable to start the order with autostart or QR code.
        Using the endpoint /payment is preferred. Only use /other/payment for the edge case where neither autostart nor QR code are feasible.

        Use the `/collect` method to query the status of the order.
      operationId: otherPayment
      requestBody:
        content:
          application/json:
            examples:
              request:
                summary: A payment request
                value:
                  personalNumber: "200001012384"
                  riskFlags:
                  - largeAmount
                  - newCustomer
                  - newCard
                  userVisibleTransaction:
                    transactionType: card
                    recipient:
                      nameB64: UGF5bWVudCBSZWNpcGllbnRzIEluYy4=
                    money:
                      amount: "100,00"
                      currency: EUR
